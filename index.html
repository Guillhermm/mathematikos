<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mathematikos - Journey Through Ancient Numbers</title>
    <meta name="description" content="Travel through time and solve mathematical challenges using ancient number systems.">
    <meta name="theme-color" content="#8B4513">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
    <link rel="stylesheet" href="styles.css">
    <script>
        // Runs before first paint so a stored dark preference does not flash light.
        // Mirrors resolveDarkMode() in js/ui/settings.js.
        (function () {
            var pref = 'system';
            try { pref = localStorage.getItem('mathematikos_theme') || 'system'; } catch (e) {}
            var dark = pref === 'dark' || (pref !== 'light'
                && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
            if (dark) document.documentElement.setAttribute('data-dark', '');
            document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
            try {
                var lang = localStorage.getItem('mathematikos_language');
                if (lang) document.documentElement.lang = lang;
            } catch (e) {}
        })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Literata:ital,wght@0,400;0,700;1,400&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Main Menu -->
    <div id="main-menu" class="screen active">
        <div class="container">
            <button class="btn-settings" onclick="openSettings()"
                    data-i18n-title="ui.menu.settings" data-i18n-label="ui.menu.settings">
                <svg class="icon" aria-hidden="true"><use href="#i-gear"/></svg>
            </button>

            <div class="brand">
                <img src="icons/astrolabe.svg" class="brand-icon" alt="Mathematikos">
                <div class="brand-text">
                    <h1 class="game-title" data-i18n-skip>Mathematikos</h1>
                    <p class="subtitle" data-i18n="ui.menu.subtitle"></p>
                </div>
            </div>

            <div class="menu-options">
                <button class="menu-btn menu-btn-thematic" onclick="startGame('thematic')">
                    <div class="menu-btn-left"><svg class="icon icon-menu" aria-hidden="true"><use href="#i-scroll"/></svg><span data-i18n="ui.menu.thematic"></span></div>
                    <span class="menu-btn-arrow">→</span>
                </button>
                <button class="menu-btn menu-btn-temporal" onclick="startGame('temporal')">
                    <div class="menu-btn-left"><svg class="icon icon-menu" aria-hidden="true"><use href="#i-clock"/></svg><span data-i18n="ui.menu.temporal"></span></div>
                    <span class="menu-btn-arrow">→</span>
                </button>
                <button class="menu-btn menu-btn-practice" onclick="startGame('practice')">
                    <div class="menu-btn-left"><svg class="icon icon-menu" aria-hidden="true"><use href="#i-book"/></svg><span data-i18n="ui.menu.practice"></span></div>
                    <span class="menu-btn-arrow">→</span>
                </button>
                <button class="menu-btn menu-btn-daily" onclick="showDailyChallenge()">
                    <div class="menu-btn-left"><svg class="icon icon-menu" aria-hidden="true"><use href="#i-calendar"/></svg><span data-i18n="ui.menu.daily"></span></div>
                    <span class="menu-btn-arrow">→</span>
                </button>
            </div>

            <div class="menu-footer">
                <button class="btn-about-link" onclick="showAbout()" data-i18n="ui.menu.about"></button>
                <span class="menu-version">v1.1.1</span>
            </div>
        </div>
    </div>

    <!-- Civilization Selection -->
    <div id="civilization-select" class="screen">
        <div class="container">
            <h2 data-i18n="ui.civSelect.title"></h2>
            <p class="civ-select-subtitle" data-i18n="ui.civSelect.subtitle"></p>
            <div id="civilization-list" class="civilization-grid"></div>
            <button class="btn btn-back" onclick="showScreen('main-menu')" data-i18n="ui.common.backToMenu"></button>
        </div>
    </div>

    <!-- Story Introduction -->
    <div id="story-intro" class="screen">
        <header class="story-intro-header">
            <button class="btn-game-back" onclick="showScreen('civilization-select')" data-i18n-title="ui.story.back">←</button>
            <span class="story-intro-header-civ" id="story-intro-civ-title"></span>
            <button class="btn-game-back" onclick="openCodexCurrent()" data-i18n-title="ui.story.openCodex"><svg class="icon" aria-hidden="true"><use href="#i-book"/></svg></button>
        </header>
        <div class="story-scroll">
            <div id="story-content"></div>
        </div>
        <div class="story-cta">
            <button class="btn-begin-challenge" onclick="startChallenge()" data-i18n="ui.story.begin"></button>
        </div>
    </div>

    <!-- Game Play -->
    <div id="game-play" class="screen">
        <!-- Header: back | timer | score + sound -->
        <div class="game-header">
            <button class="btn-game-back" onclick="showScreen('story-intro')" data-i18n-title="ui.game.backToStory">←</button>
            <div class="game-header-timer">
                <svg class="icon game-timer-icon" aria-hidden="true"><use href="#i-clock"/></svg>
                <span id="timer" class="value">00:00</span>
            </div>
            <div class="game-header-right">
                <div class="game-score-coin">
                    <span id="score">0</span>
                    <svg class="icon" aria-hidden="true"><use href="#i-coin"/></svg>
                </div>
                <span class="oracle-badge" id="oracle-badge"><svg class="icon" aria-hidden="true"><use href="#i-oracle"/></svg><span id="oracle-count">0</span></span>
                <button class="btn-sound-toggle" id="sound-toggle" onclick="toggleAmbient()" data-i18n-title="ui.game.toggleSound"><svg class="icon" aria-hidden="true"><use href="#i-sound-on"/></svg></button>
            </div>
        </div>

        <!-- Challenge progress strip -->
        <div class="game-challenge-strip">
            <div class="game-progress-track">
                <div class="game-progress-fill" id="progress-fill"></div>
            </div>
            <div class="game-challenge-label" id="challenge-number">Challenge 1/5</div>
        </div>

        <!-- Context chips (mobile only, hidden on desktop) -->
        <div class="context-chips">
            <button class="chip-btn" id="chip-btn-scene" onclick="toggleChip('scene')"><svg class="icon" aria-hidden="true"><use href="#i-scroll"/></svg><span data-i18n="ui.game.storyChip"></span></button>
            <button class="chip-btn" id="chip-btn-guide" onclick="toggleChip('guide')"><svg class="icon" aria-hidden="true"><use href="#i-book"/></svg><span data-i18n="ui.game.guideChip"></span></button>
        </div>

        <!-- Desktop sidebar + mobile collapsible panels -->
        <div class="game-columns">
            <!-- Left sidebar (desktop) / collapsible panels (mobile) -->
            <div class="game-sidebar">
                <div class="chip-panel" id="chip-panel-scene">
                    <div id="scene-description" class="scene-box"></div>
                </div>
                <div class="chip-panel" id="chip-panel-guide">
                    <div id="number-system-info" class="info-box"></div>
                </div>
                <!-- Oracle pieces: left sidebar on desktop -->
                <div class="oracle-pieces">
                    <h4 data-i18n="ui.game.oraclePieces"></h4>
                    <div id="pieces-display" class="pieces-grid"></div>
                </div>
            </div>

            <!-- Right column: scrollable game body -->
            <div class="game-scroll">
                <div class="challenge-area">
                    <!-- The answer slot lives inside the equation: you complete the sum
                         rather than restating it in a separate labelled box. -->
                    <div class="problem-display" id="problem-display">
                        <div id="problem" class="problem"></div>
                        <span class="problem-equals" aria-hidden="true">=</span>
                        <div id="built-answer" class="built-answer answer-slot"
                             data-i18n-slot="ui.game.answerPlaceholder"
                             data-i18n-label="ui.game.answerLabel"
                             role="status" aria-live="polite"></div>
                    </div>

                    <div class="answer-section">
                        <div class="symbol-pad-zone">
                            <div id="symbol-pad" class="symbol-pad"></div>
                        </div>
                        <div id="feedback" class="feedback"></div>
                        <div class="hint-section">
                            <button class="btn btn-hint" onclick="showHint()"><svg class="icon" aria-hidden="true"><use href="#i-lamp"/></svg><span data-i18n="ui.game.hint"></span></button>
                            <div id="hint-display" class="hint-display"></div>
                        </div>
                        <!-- Hidden, kept for JS compatibility -->
                        <input type="text" id="answer-input" autocomplete="off" style="display:none">
                    </div>
                </div>
            </div>
        </div>

        <!-- Sticky action row -->
        <div class="game-action-row">
            <button class="btn btn-clear" onclick="clearAnswer()" data-i18n="ui.game.clear"></button>
            <button class="btn btn-backspace" onclick="backspaceAnswer()" data-i18n="ui.game.backspace"></button>
            <button class="btn btn-primary btn-submit" onclick="submitAnswer()"><svg class="icon" aria-hidden="true"><use href="#i-check"/></svg><span data-i18n="ui.game.submit"></span></button>
        </div>
    </div>

    <!-- Results Screen -->
    <div id="results" class="screen">
        <div class="container">
            <h2 id="results-title" data-i18n="ui.results.title"></h2>
            <div id="results-content" class="results-box"></div>
            <div class="results-actions">
                <button class="btn btn-primary" onclick="nextCivilization()" data-i18n="ui.results.continue"></button>
                <div class="results-actions-row">
                    <button id="codex-btn" class="btn btn-quiet" style="display:none" onclick="openCodexCurrent()"><svg class="icon" aria-hidden="true"><use href="#i-book"/></svg><span data-i18n="ui.results.openCodex"></span></button>
                    <button class="btn btn-quiet" onclick="showScreen('civilization-select')" data-i18n="ui.results.chooseAnother"></button>
                </div>
                <button class="btn btn-text" onclick="showScreen('main-menu')" data-i18n="ui.results.mainMenu"></button>
            </div>
        </div>
    </div>

    <!-- Daily Challenge Screen -->
    <div id="daily-screen" class="screen">
        <div class="container">
            <h2><svg class="icon icon-heading" aria-hidden="true"><use href="#i-calendar"/></svg><span data-i18n="ui.daily.title"></span></h2>
            <div id="daily-content"></div>
            <div id="daily-actions"></div>
            <button class="btn btn-back" onclick="showScreen('main-menu')" data-i18n="ui.common.backToMenu"></button>
        </div>
    </div>

    <!-- About Screen -->
    <div id="about-screen" class="screen">
        <div class="container">
            <h2 data-i18n="ui.about.title"></h2>
            <div id="about-content"></div>
            <button class="btn btn-back" onclick="showScreen('main-menu')" data-i18n="ui.common.backToMenu"></button>
        </div>
    </div>

    <!-- Tutorial/Help Modal -->
    <div id="help-modal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeHelp()" data-i18n-skip>&times;</span>
            <h3 data-i18n="ui.help.title"></h3>
            <div id="help-content"></div>
        </div>
    </div>

    <!-- Codex Modal -->
    <div id="settings-modal" class="modal">
        <div class="modal-content settings-modal-content" role="dialog" aria-modal="true"
             data-i18n-label="ui.settings.title">
            <span class="close" onclick="closeSettings()" data-i18n-label="ui.common.close" data-i18n-skip>&times;</span>
            <h3 data-i18n="ui.settings.title"></h3>
            <div id="settings-content"></div>
        </div>
    </div>

    <div id="codex-modal" class="modal">
        <div class="modal-content codex-modal-content">
            <span class="close" onclick="closeCodex()" data-i18n-skip>&times;</span>
            <div id="codex-content"></div>
        </div>
    </div>

    <!-- Language: the runtime first, then every catalog it registers -->
    <script src="js/i18n.js"></script>
    <script src="js/locales/en.js"></script>
    <script src="js/locales/es.js"></script>
    <script src="js/locales/fr.js"></script>
    <script src="js/locales/de.js"></script>
    <script src="js/locales/pt-BR.js"></script>
    <!-- Core -->
    <script src="js/state.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/symbols.js"></script>
    <script src="js/themes.js"></script>
    <script src="js/codex.js"></script>
    <script src="js/daily.js"></script>
    <!-- Civilizations -->
    <script src="js/civilizations/roman.js"></script>
    <script src="js/civilizations/egyptian.js"></script>
    <script src="js/civilizations/greek.js"></script>
    <script src="js/civilizations/babylonian.js"></script>
    <script src="js/civilizations/chinese.js"></script>
    <script src="js/civilizations/mayan.js"></script>
    <script src="js/civilizations/hindu-arabic.js"></script>
    <!-- UI -->
    <script src="js/ui/icons.js"></script>
    <script src="js/ui/settings.js"></script>
    <script src="js/ui/scenes.js"></script>
    <script src="js/ui/briefing.js"></script>
    <script src="js/ui/screens.js"></script>
    <script src="js/ui/symbol-pad.js"></script>
    <script src="js/ui/feedback.js"></script>
    <script src="js/ui/timer.js"></script>
    <script src="js/ui/about.js"></script>
    <script src="js/ui/daily-screen.js"></script>
    <!-- Game logic -->
    <script src="js/challenges/cross-civ.js"></script>
    <script src="js/challenges.js"></script>
    <script src="js/game.js"></script>
    <!-- PWA -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(() => {});
            });
        }
    </script>
</body>
</html>
